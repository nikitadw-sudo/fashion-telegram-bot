name: Fashion channel autopost

on:
  schedule:
    - cron: '30 6 * * *'  # 09:30 Moscow (UTC+3)
    - cron: '0 15 * * *'  # 18:00 Moscow (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

# Manual and scheduled runs must not publish the same article concurrently.
concurrency:
  group: fashion-autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out default branch and publication history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish one news story
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: python bot.py

      - name: Save publication history
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -f posted.json ]; then
            exit 0
          fi
          python -c 'import json; data = json.load(open("posted.json")); assert isinstance(data, list) and all(isinstance(url, str) for url in data)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posted.json
          if git diff --cached --quiet; then
            echo "Publication history unchanged"
            exit 0
          fi
          git commit -m "Update posted fashion news [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to save posted.json to the repository"
          exit 1
